<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>العقل الصغير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0a0b10;
    --panel:#12141c;
    --panel-2:#181b26;
    --line:rgba(255,255,255,0.07);
    --text:#e7e6f0;
    --text-dim:#8a8ca0;
    --synapse:#7c5cff;
    --synapse-dim:rgba(124,92,255,0.28);
    --teach:#f2a65a;
    --ok:#5ad1a8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;overflow:hidden;}
  .mono{font-family:'JetBrains Mono',monospace;}

  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;}

  /* ===== HEADER: brain capacity signature ===== */
  header{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg, rgba(124,92,255,0.06), transparent);flex-shrink:0;}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .title{font-weight:900;font-size:17px;letter-spacing:.2px;}
  .title span{color:var(--synapse);}
  #reset-btn{background:none;border:1px solid var(--line);color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 9px;border-radius:7px;}
  #reset-btn:active{background:rgba(255,255,255,.06);}

  #brain-grid{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-top:10px;}
  .neuron{aspect-ratio:1;border-radius:2px;background:rgba(255,255,255,.06);transition:background .4s, box-shadow .4s;}
  .neuron.lit{background:var(--synapse);box-shadow:0 0 6px var(--synapse-dim);}
  .neuron.pulse{animation:pulse 1.1s ease;}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

  #stats-row{display:flex;gap:14px;margin-top:9px;font-size:11px;color:var(--text-dim);}
  #stats-row b{color:var(--text);font-weight:600;}

  /* ===== CHAT ===== */
  #chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}
  .msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.55;white-space:pre-wrap;}
  .msg.user{align-self:flex-end;background:var(--synapse);color:#fff;border-bottom-left-radius:4px;border-bottom-right-radius:14px;}
  .msg.bot{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);border-bottom-right-radius:4px;}
  .msg.system{align-self:center;background:transparent;color:var(--text-dim);font-size:12px;text-align:center;max-width:90%;}
  .confidence{display:block;margin-top:5px;font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .msg.bot.uncertain{border-color:rgba(242,166,90,.4);}

  /* ===== TEACH CARD ===== */
  .teach-card{align-self:stretch;background:var(--panel-2);border:1px solid rgba(242,166,90,.35);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .teach-card .label{font-size:12px;color:var(--teach);font-weight:700;}
  .teach-card input{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font-size:14px;font-family:'Tajawal',sans-serif;}
  .teach-card .hint{font-size:11px;color:var(--text-dim);}
  .teach-row{display:flex;gap:8px;}
  .teach-row button{flex:1;border:none;border-radius:9px;padding:10px;font-weight:700;font-size:13px;}
  .teach-confirm{background:var(--teach);color:#1a1206;}
  .teach-cancel{background:transparent;border:1px solid var(--line) !important;color:var(--text-dim);}

  /* ===== INPUT BAR ===== */
  #input-bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel);flex-shrink:0;}
  #msg-input{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:22px;padding:12px 16px;font-size:15px;font-family:'Tajawal',sans-serif;}
  #msg-input:focus{outline:none;border-color:var(--synapse);}
  #send-btn{width:46px;height:46px;border-radius:50%;background:var(--synapse);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #send-btn:active{transform:scale(.93);}
  #send-btn svg{transform:scaleX(-1);}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="head-row">
      <div class="title"><span>العقل</span> الصغير</div>
      <button id="reset-btn">مسح كل التعلّم</button>
    </div>
    <div id="brain-grid"></div>
    <div id="stats-row">
      <span>متعلّم: <b id="stat-labels">0</b>/<span id="stat-max">40</span> فئة</span>
      <span>أمثلة: <b id="stat-examples">0</b></span>
    </div>
  </header>

  <div id="chat"></div>

  <div id="input-bar">
    <input id="msg-input" type="text" placeholder="اكتب رسالة عادية..." autocomplete="off">
    <button id="send-btn"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="#fff" d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></button>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   FIREBASE
   -----------------------------------------------------------
   ⚠️ محتاج تعمل مشروع Firebase جديد وتحط بياناته هنا قبل الرفع.
   المستند ده بيتحفظ فيه "دماغ" واحد مشترك بين كل أجهزتك (مش لكل
   جهاز نسخة منفصلة) - فأي جهاز تفتح منه الصفحة هيشوف نفس التعلّم.

   إعدادات مطلوبة على Firestore Rules (Firebase Console):
     match /miniBrain/{doc} {
       allow read, write: if request.auth != null;
     }
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyC_1ZPw0NMw2YznMO0PE9vZGzFVa0f7jvQ",
  authDomain: "ai-prime-f9017.firebaseapp.com",
  projectId: "ai-prime-f9017",
  storageBucket: "ai-prime-f9017.firebasestorage.app",
  messagingSenderId: "932445525165",
  appId: "1:932445525165:web:425c870176b2091d12e224"
};

let db = null;
let firebaseReady = true;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch(err){
  console.error('Firebase init failed', err);
  firebaseReady = false;
}
const BRAIN_DOC_PATH = ['miniBrain', 'sharedState']; // مستند واحد ثابت مشترك بين الأجهزة

function ensureFirebaseAuth(){
  return new Promise((resolve)=>{
    if(!firebaseReady){ resolve(false); return; }
    firebase.auth().onAuthStateChanged(user=>{
      if(user){ resolve(true); return; }
      firebase.auth().signInAnonymously().then(()=>resolve(true)).catch(err=>{
        console.error('Auth failed', err);
        resolve(false);
      });
    });
  });
}

/* =========================================================
   المحرك: نفس محرك الشبكة العصبية اللي بنيناه من الصفر
   (matrix ops + backprop) - منقول هنا للمتصفح بدون أي تعديل
   جوهري في المنطق، بس من غير require/module.exports.
   ========================================================= */
function zeros(rows, cols){ const m=[]; for(let i=0;i<rows;i++) m.push(new Array(cols).fill(0)); return m; }
function randomMatrix(rows, cols, scale){ const m=[]; for(let i=0;i<rows;i++){ const row=[]; for(let j=0;j<cols;j++) row.push((Math.random()*2-1)*scale); m.push(row);} return m; }
function multiply(a,b){ const rA=a.length,cA=a[0].length,cB=b[0].length; const r=zeros(rA,cB); for(let i=0;i<rA;i++) for(let j=0;j<cB;j++){ let s=0; for(let k=0;k<cA;k++) s+=a[i][k]*b[k][j]; r[i][j]=s; } return r; }
function add(a,b){ return a.map((row,i)=>row.map((v,j)=>v+b[i][j])); }
function subtract(a,b){ return a.map((row,i)=>row.map((v,j)=>v-b[i][j])); }
function hadamard(a,b){ return a.map((row,i)=>row.map((v,j)=>v*b[i][j])); }
function transpose(a){ const rows=a.length,cols=a[0].length; const r=zeros(cols,rows); for(let i=0;i<rows;i++) for(let j=0;j<cols;j++) r[j][i]=a[i][j]; return r; }
function mapM(a,fn){ return a.map(row=>row.map(fn)); }

const ACT = {
  sigmoid: x=>1/(1+Math.exp(-x)),
  sigmoidDerivative: y=>y*(1-y)
};

class DenseLayer{
  constructor(inputSize, outputSize, w, b){
    this.weights = w || randomMatrix(inputSize, outputSize, Math.sqrt(1/inputSize));
    this.bias = b || zeros(1, outputSize);
    this.lastInput=null; this.lastOutput=null;
  }
  forward(input){
    this.lastInput = input;
    const z = add(multiply(input, this.weights), this.bias);
    const a = mapM(z, ACT.sigmoid);
    this.lastOutput = a;
    return a;
  }
  backward(outputGradient, lr){
    const deriv = mapM(this.lastOutput, ACT.sigmoidDerivative);
    const delta = hadamard(outputGradient, deriv);
    const wGrad = multiply(transpose(this.lastInput), delta);
    const inGrad = multiply(delta, transpose(this.weights));
    for(let i=0;i<this.weights.length;i++) for(let j=0;j<this.weights[0].length;j++) this.weights[i][j]-=lr*wGrad[i][j];
    for(let j=0;j<this.bias[0].length;j++) this.bias[0][j]-=lr*delta[0][j];
    return inGrad;
  }
}

class NeuralNetwork{
  constructor(sizes, savedLayers){
    this.layers=[];
    for(let i=0;i<sizes.length-1;i++){
      const saved = savedLayers && savedLayers[i];
      this.layers.push(new DenseLayer(sizes[i], sizes[i+1], saved?saved.weights:null, saved?saved.bias:null));
    }
  }
  predict(input){ let o=input; for(const l of this.layers) o=l.forward(o); return o; }
  trainStep(input, target, lr){
    const out = this.predict(input);
    let grad = subtract(out, target);
    for(let i=this.layers.length-1;i>=0;i--) grad = this.layers[i].backward(grad, lr);
  }
  serialize(){ return this.layers.map(l=>({weights:l.weights, bias:l.bias})); }
}

/* =========================================================
   استخراج خصائص النص (feature extraction) بطريقة hashing:
   بدل ما نحتاج نبني قاموس كلمات بيكبر بلا حدود (وده هيغيّر
   حجم الشبكة كل مرة)، بنحوّل كل كلمة لرقم ثابت الحجم عن طريق
   hash. كده حجم المدخل ثابت (INPUT_DIM) حتى لو الكلمات الجديدة
   بلا نهاية.
   ========================================================= */
const INPUT_DIM = 64;
const HIDDEN_DIM = 24;
const MAX_LABELS = 40;
const CONFIDENCE_THRESHOLD = 0.55;

function tokenize(text){
  return text
    .replace(/[\u064B-\u0652]/g,'') // إزالة التشكيل
    .replace(/[^\u0621-\u064A0-9a-zA-Z\s]/g,' ')
    .trim().split(/\s+/).filter(Boolean);
}
function hashWord(word){
  let h = 0;
  for(let i=0;i<word.length;i++){ h = (h*31 + word.charCodeAt(i)) >>> 0; }
  return h % INPUT_DIM;
}
function textToVector(text){
  const vec = new Array(INPUT_DIM).fill(0);
  const tokens = tokenize(text);
  for(const t of tokens){ vec[hashWord(t)] += 1; }
  const maxVal = Math.max(1, ...vec);
  return [vec.map(v=>v/maxVal)]; // مصفوفة 1×INPUT_DIM، منرملة بين 0 و1
}
function oneHot(index, size){
  const v = new Array(size).fill(0);
  v[index] = 1;
  return [v];
}

/* =========================================================
   الحالة + الحفظ عبر Firebase Firestore (مستند مشترك بين كل الأجهزة)
   ========================================================= */
let network = null;
let labels = [];     // [{ index, name, responses:[...] }]
let examples = [];   // [{ text, labelIndex }]

function brainDocRef(){
  return db.collection(BRAIN_DOC_PATH[0]).doc(BRAIN_DOC_PATH[1]);
}

async function loadState(){
  network = new NeuralNetwork([INPUT_DIM, HIDDEN_DIM, MAX_LABELS]);
  labels = [];
  examples = [];
  if(!firebaseReady || !db) return; // هيشتغل أوفلاين بذاكرة مؤقتة لو Firebase مش متاح

  try{
    const snap = await brainDocRef().get();
    if(snap.exists){
      const data = snap.data();
      labels = data.labels || [];
      examples = data.examples || [];
      const layers = data.layersJson ? JSON.parse(data.layersJson) : null;
      network = new NeuralNetwork([INPUT_DIM, HIDDEN_DIM, MAX_LABELS], layers);
    }
  } catch(e){ console.error('تعذر تحميل الحالة من Firebase', e); }
}
async function saveState(){
  if(!firebaseReady || !db) return;
  try{
    // أوزان الشبكة بتتحفظ كنص JSON جوه حقل واحد (Firestore مش مريح
    // مع مصفوفات متداخلة عميقة كحقول مباشرة).
    await brainDocRef().set({
      layersJson: JSON.stringify(network.serialize()),
      labels, examples,
      updatedAt: Date.now()
    });
  } catch(e){ console.error('تعذر الحفظ في Firebase', e); }
}

/* إعادة تدريب الشبكة على كل الأمثلة المحفوظة من الصفر - بيمنع
   "النسيان الكارثي" (catastrophic forgetting) اللي بيحصل لو دربنا
   على مثال جديد بس من غير ما نراجع القديم. */
async function retrainAll(){
  network = new NeuralNetwork([INPUT_DIM, HIDDEN_DIM, MAX_LABELS]);
  if(examples.length === 0) return;
  const EPOCHS = 250, LR = 0.4;
  for(let e=0;e<EPOCHS;e++){
    for(const ex of examples){
      network.trainStep(textToVector(ex.text), oneHot(ex.labelIndex, MAX_LABELS), LR);
    }
  }
}

function classify(text){
  const out = network.predict(textToVector(text))[0];
  let bestIdx=-1, bestVal=-1;
  for(const lab of labels){
    if(out[lab.index] > bestVal){ bestVal = out[lab.index]; bestIdx = lab.index; }
  }
  if(bestIdx===-1 || bestVal < CONFIDENCE_THRESHOLD) return { confident:false, confidence:bestVal<0?0:bestVal };
  const label = labels.find(l=>l.index===bestIdx);
  return { confident:true, confidence:bestVal, label };
}

/* =========================================================
   الواجهة
   ========================================================= */
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const brainGrid = document.getElementById('brain-grid');
const statLabels = document.getElementById('stat-labels');
const statExamples = document.getElementById('stat-examples');
document.getElementById('stat-max').textContent = MAX_LABELS;

function scrollToBottom(){ chatEl.scrollTop = chatEl.scrollHeight; }

function addMessage(text, cls, confidence){
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  if(confidence!==undefined){
    const c = document.createElement('span');
    c.className='confidence mono';
    c.textContent = 'ثقة: ' + Math.round(confidence*100) + '%';
    div.appendChild(c);
  }
  chatEl.appendChild(div);
  scrollToBottom();
  return div;
}
function addSystem(text){
  const div = document.createElement('div');
  div.className='msg system';
  div.textContent = text;
  chatEl.appendChild(div);
  scrollToBottom();
}

function renderBrainGrid(){
  brainGrid.innerHTML='';
  for(let i=0;i<MAX_LABELS;i++){
    const cell = document.createElement('div');
    cell.className = 'neuron' + (labels.some(l=>l.index===i) ? ' lit' : '');
    cell.id = 'neuron-'+i;
    brainGrid.appendChild(cell);
  }
  statLabels.textContent = labels.length;
  statExamples.textContent = examples.length;
}
function pulseNeuron(index){
  const el = document.getElementById('neuron-'+index);
  if(!el) return;
  el.classList.add('pulse');
  setTimeout(()=>el.classList.remove('pulse'), 1100);
}

function showTeachCard(originalText){
  const card = document.createElement('div');
  card.className='teach-card';
  card.innerHTML = `
    <div class="label">علّمها الرد المناسب على الرسالة دي</div>
    <input class="teach-name" placeholder="اسم الفئة (اختياري - مثلاً: تحية)" />
    <input class="teach-response" placeholder="الرد اللي المفروض تقوله" />
    <div class="hint">لو الاسم ده موجود قبل كده، هتضاف عليه كمثال جديد بدل فئة جديدة.</div>
    <div class="teach-row">
      <button class="teach-cancel">إلغاء</button>
      <button class="teach-confirm">علّمها</button>
    </div>
  `;
  chatEl.appendChild(card);
  scrollToBottom();

  card.querySelector('.teach-cancel').addEventListener('click', ()=>{ card.remove(); });
  card.querySelector('.teach-confirm').addEventListener('click', async ()=>{
    const nameInput = card.querySelector('.teach-name').value.trim();
    const responseInput = card.querySelector('.teach-response').value.trim();
    if(!responseInput){ card.querySelector('.teach-response').focus(); return; }

    card.querySelector('.teach-confirm').textContent = 'بتتعلم...';
    card.querySelector('.teach-confirm').disabled = true;

    let label = nameInput ? labels.find(l=>l.name===nameInput) : null;
    if(!label){
      if(labels.length >= MAX_LABELS){
        card.remove();
        addSystem('العقل وصل لأقصى عدد فئات (' + MAX_LABELS + ') - محتاج تكبير الشبكة عشان يتعلم أكتر.');
        return;
      }
      const usedIndices = labels.map(l=>l.index);
      let freeIndex = 0;
      while(usedIndices.includes(freeIndex)) freeIndex++;
      label = { index: freeIndex, name: nameInput || ('فئة_'+(labels.length+1)), responses: [] };
      labels.push(label);
    }
    if(!label.responses.includes(responseInput)) label.responses.push(responseInput);
    examples.push({ text: originalText, labelIndex: label.index });

    await retrainAll();
    await saveState();
    renderBrainGrid();
    pulseNeuron(label.index);

    card.remove();
    addSystem('اتعلمت ✓ (فئة: ' + label.name + ')');

    // نجرب نصنّف نفس الرسالة تاني عشان نوريه إنه فهم فعلاً
    const result = classify(originalText);
    if(result.confident){
      addMessage(result.label.responses[Math.floor(Math.random()*result.label.responses.length)], 'bot', result.confidence);
    }
  });
}

async function handleSend(){
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value='';
  addMessage(text, 'user');

  const result = classify(text);
  if(result.confident){
    const response = result.label.responses[Math.floor(Math.random()*result.label.responses.length)];
    addMessage(response, 'bot', result.confidence);
  } else {
    const bubble = addMessage('مش لسه اتعلمت رد مناسب على الكلام ده 🤔', 'bot uncertain', result.confidence);
    showTeachCard(text);
  }
}

sendBtn.addEventListener('click', handleSend);
inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });

document.getElementById('reset-btn').addEventListener('click', async ()=>{
  if(!confirm('هتتمسح كل حاجة اتعلمها العقل. متأكد؟')) return;
  labels=[]; examples=[];
  network = new NeuralNetwork([INPUT_DIM, HIDDEN_DIM, MAX_LABELS]);
  await saveState();
  renderBrainGrid();
  chatEl.innerHTML='';
  addSystem('اتمسح كل التعلّم - العقل رجع فاضي زي أول مرة.');
});

/* =========================================================
   بداية التشغيل
   ========================================================= */
async function boot(){
  addSystem('جاري الاتصال...');
  const authOk = await ensureFirebaseAuth();
  if(!authOk){
    addSystem('⚠️ تعذر الاتصال بـ Firebase - تأكد إنك حطيت بيانات مشروعك في firebaseConfig وفعّلت Anonymous Auth. هيشتغل مؤقتًا بدون حفظ.');
  }
  await loadState();
  chatEl.innerHTML='';
  renderBrainGrid();

  if(labels.length===0){
    addSystem('العقل ده فاضي دلوقتي - كل رد فيه إنت اللي هتعلّمه ليه بنفسك.');
    addMessage('اكتبلي أي رسالة، ولو معرفتش أرد هطلب منك تعلّمني 🧠', 'bot');
  } else {
    addSystem('اترجع العقل - عنده ' + labels.length + ' فئة اتعلمها قبل كده (متزامن من كل أجهزتك).');
  }
}
boot();

})();
</script>
</body>
</html>
