<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>العقل الصغير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0a0b10;
    --panel:#12141c;
    --panel-2:#181b26;
    --line:rgba(255,255,255,0.07);
    --text:#e7e6f0;
    --text-dim:#8a8ca0;
    --synapse:#7c5cff;
    --synapse-dim:rgba(124,92,255,0.28);
    --teach:#f2a65a;
    --ok:#5ad1a8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;overflow:hidden;}
  .mono{font-family:'JetBrains Mono',monospace;}

  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;}

  /* ===== HEADER: brain capacity signature ===== */
  header{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg, rgba(124,92,255,0.06), transparent);flex-shrink:0;}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .title{font-weight:900;font-size:17px;letter-spacing:.2px;}
  .title span{color:var(--synapse);}
  .head-btns{display:flex;gap:6px;}
  #reset-btn,#bulk-btn{background:none;border:1px solid var(--line);color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 9px;border-radius:7px;}
  #reset-btn:active,#bulk-btn:active{background:rgba(255,255,255,.06);}
  #bulk-btn{border-color:rgba(124,92,255,.4);color:var(--synapse);}

  .bulk-card{align-self:stretch;background:var(--panel-2);border:1px solid rgba(124,92,255,.35);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .bulk-card .label{font-size:12px;color:var(--synapse);font-weight:700;}
  .bulk-card textarea{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font-size:13px;font-family:'JetBrains Mono',monospace;min-height:140px;resize:vertical;direction:rtl;}
  .bulk-card .hint{font-size:11px;color:var(--text-dim);line-height:1.6;}
  .bulk-row{display:flex;gap:8px;}
  .bulk-row button{flex:1;border:none;border-radius:9px;padding:10px;font-weight:700;font-size:13px;}
  .bulk-confirm{background:var(--synapse);color:#fff;}
  .bulk-cancel{background:transparent;border:1px solid var(--line) !important;color:var(--text-dim);}

  #brain-grid{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-top:10px;}
  .neuron{aspect-ratio:1;border-radius:2px;background:rgba(255,255,255,.06);transition:background .4s, box-shadow .4s;}
  .neuron.lit{background:var(--synapse);box-shadow:0 0 6px var(--synapse-dim);}
  .neuron.pulse{animation:pulse 1.1s ease;}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

  #stats-row{display:flex;gap:14px;margin-top:9px;font-size:11px;color:var(--text-dim);}
  #stats-row b{color:var(--text);font-weight:600;}

  /* ===== CHAT ===== */
  #chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}
  .msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.55;white-space:pre-wrap;}
  .msg.user{align-self:flex-end;background:var(--synapse);color:#fff;border-bottom-left-radius:4px;border-bottom-right-radius:14px;}
  .msg.bot{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);border-bottom-right-radius:4px;}
  .msg.system{align-self:center;background:transparent;color:var(--text-dim);font-size:12px;text-align:center;max-width:90%;}
  .confidence{display:block;margin-top:5px;font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .msg.bot.uncertain{border-color:rgba(242,166,90,.4);}

  /* ===== TEACH CARD ===== */
  .teach-card{align-self:stretch;background:var(--panel-2);border:1px solid rgba(242,166,90,.35);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .teach-card .label{font-size:12px;color:var(--teach);font-weight:700;}
  .teach-card input{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font-size:14px;font-family:'Tajawal',sans-serif;}
  .teach-card .hint{font-size:11px;color:var(--text-dim);}
  .teach-row{display:flex;gap:8px;}
  .teach-row button{flex:1;border:none;border-radius:9px;padding:10px;font-weight:700;font-size:13px;}
  .teach-confirm{background:var(--teach);color:#1a1206;}
  .teach-cancel{background:transparent;border:1px solid var(--line) !important;color:var(--text-dim);}

  /* ===== INPUT BAR ===== */
  #input-bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel);flex-shrink:0;}
  #msg-input{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:22px;padding:12px 16px;font-size:15px;font-family:'Tajawal',sans-serif;}
  #msg-input:focus{outline:none;border-color:var(--synapse);}
  #send-btn{width:46px;height:46px;border-radius:50%;background:var(--synapse);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #send-btn:active{transform:scale(.93);}
  #send-btn svg{transform:scaleX(-1);}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="head-row">
      <div class="title"><span>العقل</span> الصغير</div>
      <div class="head-btns">
        <button id="bulk-btn">استيراد جماعي</button>
        <button id="reset-btn">مسح كل التعلّم</button>
      </div>
    </div>
    <div id="brain-grid"></div>
    <div id="stats-row">
      <span>متعلّم: <b id="stat-labels">0</b> فئة</span>
      <span>أمثلة: <b id="stat-examples">0</b></span>
    </div>
  </header>

  <div id="chat"></div>

  <div id="input-bar">
    <input id="msg-input" type="text" placeholder="اكتب رسالة عادية..." autocomplete="off">
    <button id="send-btn"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="#fff" d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></button>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   FIREBASE
   -----------------------------------------------------------
   ⚠️ محتاج تعمل مشروع Firebase جديد وتحط بياناته هنا قبل الرفع.
   المستند ده بيتحفظ فيه "دماغ" واحد مشترك بين كل أجهزتك (مش لكل
   جهاز نسخة منفصلة) - فأي جهاز تفتح منه الصفحة هيشوف نفس التعلّم.

   إعدادات مطلوبة على Firestore Rules (Firebase Console):
     match /miniBrain/{doc} {
       allow read, write: if request.auth != null;
     }
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyC_1ZPw0NMw2YznMO0PE9vZGzFVa0f7jvQ",
  authDomain: "ai-prime-f9017.firebaseapp.com",
  projectId: "ai-prime-f9017",
  storageBucket: "ai-prime-f9017.firebasestorage.app",
  messagingSenderId: "932445525165",
  appId: "1:932445525165:web:425c870176b2091d12e224"
};

let db = null;
let firebaseReady = true;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch(err){
  console.error('Firebase init failed', err);
  firebaseReady = false;
}
const BRAIN_DOC_PATH = ['miniBrain', 'sharedState']; // مستند واحد ثابت مشترك بين الأجهزة

function ensureFirebaseAuth(){
  return new Promise((resolve)=>{
    if(!firebaseReady){ resolve(false); return; }
    firebase.auth().onAuthStateChanged(user=>{
      if(user){ resolve(true); return; }
      firebase.auth().signInAnonymously().then(()=>resolve(true)).catch(err=>{
        console.error('Auth failed', err);
        resolve(false);
      });
    });
  });
}

/* =========================================================
   المحرك: مقارنة تشابه (similarity matching) بدل شبكة بمخرج
   ثابت الحجم. المعمارية القديمة كانت مربوطة بعدد فئات ثابت
   (MAX_LABELS=40) لأن آخر طبقة في الشبكة لازم يبقى حجمها معروف
   مقدمًا. النظام ده بيشتغل بفكرة مختلفة تمامًا: كل مثال بيتحول
   لمتجه، ولما رسالة جديدة توصل، بنقارنها بكل الأمثلة المحفوظة
   (تشابه جيب التمام / cosine similarity) ونرجّع رد أقرب مثال.
   ده معناه: مفيش سقف فئات خالص، وتقدر تعلّمه آلاف الأمثلة.
   ========================================================= */
const INPUT_DIM = 192;           // حجم المتجه (زودناه عشان unigrams+bigrams يقللوا التصادم)
const CONFIDENCE_THRESHOLD = 0.42;

// كلمات ربط شائعة بتشوش المقارنة من غير ما تضيف معنى - بنشيلها
// قبل التحويل لمتجه عشان الشبكة تركّز على الكلمات المفصلية.
const STOPWORDS = new Set([
  'في','من','على','عن','الى','إلى','يا','او','أو','ثم','هل','لا','لم','لن',
  'ما','هذا','هذه','ذلك','تلك','التي','الذي','و','كان','كانت','يكون','مع',
  'كل','بعض','كذلك','ايضا','أيضا','انا','أنا','انت','أنت','هو','هي','احنا',
  'إحنا','بس','يعني','عشان','علشان'
]);

function normalizeArabic(text){
  return text
    .replace(/[\u064B-\u0652]/g,'')      // إزالة التشكيل
    .replace(/[إأآا]/g,'ا')               // توحيد أشكال الألف
    .replace(/ى/g,'ي')                    // الألف المقصورة -> ياء
    .replace(/ة/g,'ه')                    // التاء المربوطة -> هاء
    .replace(/ـ/g,'')                     // إزالة التطويل
    .replace(/[^\u0621-\u064A0-9a-zA-Z\s]/g,' ');
}
function tokenize(text){
  const tokens = normalizeArabic(text).trim().split(/\s+/).filter(Boolean);
  return tokens.filter(t=>!STOPWORDS.has(t));
}
function hashWord(word){
  let h = 0;
  for(let i=0;i<word.length;i++){ h = (h*31 + word.charCodeAt(i)) >>> 0; }
  return h % INPUT_DIM;
}
function textToVector(text){
  const vec = new Array(INPUT_DIM).fill(0);
  const tokens = tokenize(text);
  // unigrams: كل كلمة لوحدها
  for(const t of tokens){ vec[hashWord(t)] += 1; }
  // bigrams: كل زوج كلمات متتاليين - بيدّي إحساس بالسياق (مثلاً
  // "مش كويس" تختلف عن "كويس" حتى لو الكلمة التانية واحدة)
  for(let i=0;i<tokens.length-1;i++){ vec[hashWord(tokens[i]+'_'+tokens[i+1])] += 1.4; }
  const norm = Math.sqrt(vec.reduce((s,v)=>s+v*v,0));
  return norm>0 ? vec.map(v=>v/norm) : vec; // تطبيع عشان جملة طويلة ماتكسبش أفضلية غير عادلة
}
function cosineSim(a,b){
  let dot=0;
  for(let i=0;i<a.length;i++) dot += a[i]*b[i];
  return dot; // المتجهين متطبّعين بالفعل (norm=1) فالـ dot product = cosine similarity
}

/* =========================================================
   الحالة + الحفظ عبر Firebase Firestore (مستند مشترك بين كل الأجهزة)
   ========================================================= */
let labels = [];     // [{ index, name, responses:[...] }]
let examples = [];   // [{ text, labelIndex, vec }] - vec بيتحسب وقت التشغيل، مش بيتخزن

function brainDocRef(){
  return db.collection(BRAIN_DOC_PATH[0]).doc(BRAIN_DOC_PATH[1]);
}

function attachVectors(){
  for(const ex of examples){ if(!ex.vec) ex.vec = textToVector(ex.text); }
}

async function loadState(){
  labels = [];
  examples = [];
  if(!firebaseReady || !db) return; // هيشتغل أوفلاين بذاكرة مؤقتة لو Firebase مش متاح

  try{
    const snap = await brainDocRef().get();
    if(snap.exists){
      const data = snap.data();
      labels = data.labels || [];
      examples = data.examples || [];
      attachVectors();
    }
  } catch(e){ console.error('تعذر تحميل الحالة من Firebase', e); }
}
async function saveState(){
  if(!firebaseReady || !db) return;
  try{
    // بنشيل .vec قبل الحفظ (بيتحسب تاني وقت التحميل) عشان نوفر
    // مساحة في Firestore - الأمثلة بس محتاجة النص والفئة.
    const examplesToSave = examples.map(e=>({ text:e.text, labelIndex:e.labelIndex }));
    await brainDocRef().set({
      labels, examples: examplesToSave,
      updatedAt: Date.now()
    });
  } catch(e){ console.error('تعذر الحفظ في Firebase', e); }
}

function addExample(text, labelIndex){
  const vec = textToVector(text);
  examples.push({ text, labelIndex, vec });
}

function classify(text){
  if(examples.length===0) return { confident:false, confidence:0 };
  const vec = textToVector(text);
  let bestSim=-1, bestExample=null;
  for(const ex of examples){
    const sim = cosineSim(vec, ex.vec);
    if(sim>bestSim){ bestSim=sim; bestExample=ex; }
  }
  if(!bestExample || bestSim < CONFIDENCE_THRESHOLD) return { confident:false, confidence:bestSim<0?0:bestSim };
  const label = labels.find(l=>l.index===bestExample.labelIndex);
  if(!label) return { confident:false, confidence:0 };
  return { confident:true, confidence:bestSim, label };
}

/* =========================================================
   الواجهة
   ========================================================= */
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const brainGrid = document.getElementById('brain-grid');
const statLabels = document.getElementById('stat-labels');
const statExamples = document.getElementById('stat-examples');

function scrollToBottom(){ chatEl.scrollTop = chatEl.scrollHeight; }

function addMessage(text, cls, confidence){
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  if(confidence!==undefined){
    const c = document.createElement('span');
    c.className='confidence mono';
    c.textContent = 'ثقة: ' + Math.round(confidence*100) + '%';
    div.appendChild(c);
  }
  chatEl.appendChild(div);
  scrollToBottom();
  return div;
}
function addSystem(text){
  const div = document.createElement('div');
  div.className='msg system';
  div.textContent = text;
  chatEl.appendChild(div);
  scrollToBottom();
}

function renderBrainGrid(){
  brainGrid.innerHTML='';
  // شبكة بلا سقف: خلية واحدة لكل فئة موجودة فعلاً، بدل شبكة ثابتة
  // 40 خلية كانت مربوطة بحجم مخرج الشبكة العصبية القديمة.
  const cellCount = Math.max(20, labels.length);
  for(let i=0;i<cellCount;i++){
    const cell = document.createElement('div');
    cell.className = 'neuron' + (i<labels.length ? ' lit' : '');
    cell.id = 'neuron-'+i;
    brainGrid.appendChild(cell);
  }
  statLabels.textContent = labels.length;
  statExamples.textContent = examples.length;
}
function pulseNeuron(index){
  const el = document.getElementById('neuron-'+index);
  if(!el) return;
  el.classList.add('pulse');
  setTimeout(()=>el.classList.remove('pulse'), 1100);
}

function showTeachCard(originalText){
  const card = document.createElement('div');
  card.className='teach-card';
  card.innerHTML = `
    <div class="label">علّمها الرد المناسب على الرسالة دي</div>
    <input class="teach-name" placeholder="اسم الفئة (اختياري - مثلاً: تحية)" />
    <input class="teach-response" placeholder="الرد اللي المفروض تقوله" />
    <div class="hint">لو الاسم ده موجود قبل كده، هتضاف عليه كمثال جديد بدل فئة جديدة.</div>
    <div class="teach-row">
      <button class="teach-cancel">إلغاء</button>
      <button class="teach-confirm">علّمها</button>
    </div>
  `;
  chatEl.appendChild(card);
  scrollToBottom();

  card.querySelector('.teach-cancel').addEventListener('click', ()=>{ card.remove(); });
  card.querySelector('.teach-confirm').addEventListener('click', async ()=>{
    const nameInput = card.querySelector('.teach-name').value.trim();
    const responseInput = card.querySelector('.teach-response').value.trim();
    if(!responseInput){ card.querySelector('.teach-response').focus(); return; }

    card.querySelector('.teach-confirm').textContent = 'بتتعلم...';
    card.querySelector('.teach-confirm').disabled = true;

    let label = nameInput ? labels.find(l=>l.name===nameInput) : null;
    if(!label){
      // بلا سقف: كل فئة جديدة بتاخد index تسلسلي، ومفيش أقصى عدد.
      label = { index: labels.length, name: nameInput || ('فئة_'+(labels.length+1)), responses: [] };
      labels.push(label);
    }
    if(!label.responses.includes(responseInput)) label.responses.push(responseInput);
    addExample(originalText, label.index);

    await saveState();
    renderBrainGrid();
    pulseNeuron(label.index);

    card.remove();
    addSystem('اتعلمت ✓ (فئة: ' + label.name + ')');

    // نجرب نصنّف نفس الرسالة تاني عشان نوريه إنه فهم فعلاً
    const result = classify(originalText);
    if(result.confident){
      addMessage(result.label.responses[Math.floor(Math.random()*result.label.responses.length)], 'bot', result.confidence);
    }
  });
}

function showBulkImportCard(){
  const card = document.createElement('div');
  card.className='bulk-card';
  card.innerHTML = `
    <div class="label">استيراد جماعي - علّمه عشرات الأمثلة مرة واحدة</div>
    <div class="hint">كل سطر بالصيغة: <b class="mono">الفئة | الرسالة | الرد</b><br>لو الفئة موجودة قبل كده، الرسالة هتتضاف عليها كمثال جديد. مثال:<br><span class="mono">تحية | اهلا | اهلا بيك وسهلا</span></div>
    <textarea class="bulk-text" placeholder="تحية | اهلا | اهلا بيك&#10;تحية | السلام عليكم | وعليكم السلام&#10;وداع | مع السلامة | في أمان الله"></textarea>
    <div class="bulk-row">
      <button class="bulk-cancel">إلغاء</button>
      <button class="bulk-confirm">استورد</button>
    </div>
  `;
  chatEl.appendChild(card);
  scrollToBottom();

  card.querySelector('.bulk-cancel').addEventListener('click', ()=>{ card.remove(); });
  card.querySelector('.bulk-confirm').addEventListener('click', async ()=>{
    const raw = card.querySelector('.bulk-text').value;
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length===0){ return; }

    card.querySelector('.bulk-confirm').textContent = 'بيستورد...';
    card.querySelector('.bulk-confirm').disabled = true;

    let added = 0, skipped = 0;
    for(const line of lines){
      const parts = line.split('|').map(p=>p.trim());
      if(parts.length < 3 || !parts[0] || !parts[1] || !parts[2]){ skipped++; continue; }
      const [catName, msg, resp] = parts;
      let label = labels.find(l=>l.name===catName);
      if(!label){
        label = { index: labels.length, name: catName, responses: [] };
        labels.push(label);
      }
      if(!label.responses.includes(resp)) label.responses.push(resp);
      addExample(msg, label.index);
      added++;
    }

    await saveState();
    renderBrainGrid();
    card.remove();
    addSystem('اتستوردت ' + added + ' مثال ✓' + (skipped>0 ? (' (اتجاهل ' + skipped + ' سطر بصيغة غلط)') : ''));
  });
}

document.getElementById('bulk-btn').addEventListener('click', showBulkImportCard);

async function handleSend(){
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value='';
  addMessage(text, 'user');

  const result = classify(text);
  if(result.confident){
    const response = result.label.responses[Math.floor(Math.random()*result.label.responses.length)];
    addMessage(response, 'bot', result.confidence);
  } else {
    const bubble = addMessage('مش لسه اتعلمت رد مناسب على الكلام ده 🤔', 'bot uncertain', result.confidence);
    showTeachCard(text);
  }
}

sendBtn.addEventListener('click', handleSend);
inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });

document.getElementById('reset-btn').addEventListener('click', async ()=>{
  if(!confirm('هتتمسح كل حاجة اتعلمها العقل. متأكد؟')) return;
  labels=[]; examples=[];
  await saveState();
  renderBrainGrid();
  chatEl.innerHTML='';
  addSystem('اتمسح كل التعلّم - العقل رجع فاضي زي أول مرة.');
});

/* =========================================================
   بداية التشغيل
   ========================================================= */
async function boot(){
  addSystem('جاري الاتصال...');
  const authOk = await ensureFirebaseAuth();
  if(!authOk){
    addSystem('⚠️ تعذر الاتصال بـ Firebase - تأكد إنك حطيت بيانات مشروعك في firebaseConfig وفعّلت Anonymous Auth. هيشتغل مؤقتًا بدون حفظ.');
  }
  await loadState();
  chatEl.innerHTML='';
  renderBrainGrid();

  if(labels.length===0){
    addSystem('العقل ده فاضي دلوقتي - كل رد فيه إنت اللي هتعلّمه ليه بنفسك.');
    addMessage('اكتبلي أي رسالة، ولو معرفتش أرد هطلب منك تعلّمني 🧠', 'bot');
  } else {
    addSystem('اترجع العقل - عنده ' + labels.length + ' فئة اتعلمها قبل كده (متزامن من كل أجهزتك).');
  }
}
boot();

})();
</script>
</body>
</html>
