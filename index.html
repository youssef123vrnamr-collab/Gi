<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محفوظات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ LOADING ============ -->
<div id="loading-screen">
  <div class="loader-mark">محفوظات</div>
</div>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen" class="screen" style="display:none;">
  <div class="auth-card">
    <h1 class="brand">محفوظات</h1>
    <p class="brand-sub">مساحتك الخاصة، بتفتكر كل حاجة تقولها.</p>

    <div class="tab-switch">
      <button id="tab-login" class="tab-btn active" type="button">تسجيل الدخول</button>
      <button id="tab-signup" class="tab-btn" type="button">حساب جديد</button>
    </div>

    <form id="login-form" class="auth-form">
      <label class="field-label" for="login-email">البريد الإلكتروني</label>
      <input id="login-email" class="field-input" type="email" required autocomplete="email" placeholder="name@example.com">
      <label class="field-label" for="login-password">كلمة المرور</label>
      <input id="login-password" class="field-input" type="password" required autocomplete="current-password" placeholder="••••••••">
      <div id="login-error" class="field-error"></div>
      <button type="submit" class="primary-btn">دخول</button>
    </form>

    <form id="signup-form" class="auth-form" style="display:none;">
      <label class="field-label" for="signup-name">الاسم</label>
      <input id="signup-name" class="field-input" type="text" required autocomplete="name" placeholder="اسمك">
      <label class="field-label" for="signup-email">البريد الإلكتروني</label>
      <input id="signup-email" class="field-input" type="email" required autocomplete="email" placeholder="name@example.com">
      <label class="field-label" for="signup-password">كلمة المرور</label>
      <input id="signup-password" class="field-input" type="password" required autocomplete="new-password" minlength="6" placeholder="٦ حروف على الأقل">
      <div id="signup-error" class="field-error"></div>
      <button type="submit" class="primary-btn">إنشاء الحساب</button>
    </form>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app-shell" class="screen" style="display:none;">
  <aside id="sidebar">
    <div class="sidebar-top">
      <span class="brand-mini">محفوظات</span>
      <button id="new-chat-btn" class="ghost-btn" type="button">+ محادثة جديدة</button>
    </div>
    <nav id="conversation-list" class="conversation-list"></nav>
    <div class="sidebar-bottom">
      <div class="user-chip">
        <span id="user-name-label">—</span>
      </div>
      <button id="logout-btn" class="ghost-btn subtle" type="button">تسجيل الخروج</button>
    </div>
  </aside>

  <main id="chat-main">
    <header id="chat-header">
      <button id="sidebar-toggle" class="icon-btn" type="button" aria-label="القائمة">☰</button>
      <span id="conversation-title">محادثة جديدة</span>
    </header>

    <div id="messages" class="messages"></div>

    <form id="composer" class="composer">
      <textarea id="composer-input" rows="1" placeholder="اكتب رسالتك..." required></textarea>
      <button type="submit" class="send-btn" aria-label="إرسال">↑</button>
    </form>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
