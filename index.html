<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Mind</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1a17">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Digital Mind">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<!-- ============ مكتبات قراءة/إنشاء الملفات (PDF / Word / Excel / ZIP) ============ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth.js/1.7.2/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<!-- ============ LOADING ============ -->
<div id="loading-screen">
  <div class="loader-inner">
    <div class="loader-infinity">∞</div>
    <div class="loader-mark">Digital Mind</div>
    <div class="loader-model">AlalaGyGyAgha V1.6</div>
  </div>
</div>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen" class="screen" style="display:none;">
  <div class="auth-card">
    <h1 class="brand">Digital Mind<span class="brand-model">AlalaGyGyAgha V1.6</span></h1>
    <p class="brand-sub">مساحتك الخاصة، بتفتكر كل حاجة تقولها.</p>

    <div class="tab-switch">
      <button id="tab-login" class="tab-btn active" type="button">تسجيل الدخول</button>
      <button id="tab-signup" class="tab-btn" type="button">حساب جديد</button>
    </div>

    <form id="login-form" class="auth-form">
      <label class="field-label" for="login-email">البريد الإلكتروني</label>
      <input id="login-email" class="field-input" type="email" required autocomplete="email" placeholder="name@example.com">
      <label class="field-label" for="login-password">كلمة المرور</label>
      <input id="login-password" class="field-input" type="password" required autocomplete="current-password" placeholder="••••••••">
      <div id="login-error" class="field-error"></div>
      <button type="submit" class="primary-btn">دخول</button>
    </form>

    <form id="signup-form" class="auth-form" style="display:none;">
      <label class="field-label" for="signup-name">الاسم</label>
      <input id="signup-name" class="field-input" type="text" required autocomplete="name" placeholder="اسمك">
      <label class="field-label">النوع</label>
      <div class="gender-switch">
        <button type="button" id="gender-male-btn" class="gender-btn active" data-gender="male">ذكر</button>
        <button type="button" id="gender-female-btn" class="gender-btn" data-gender="female">أنثى</button>
      </div>
      <input type="hidden" id="signup-gender" value="male">
      <label class="field-label" for="signup-email">البريد الإلكتروني</label>
      <input id="signup-email" class="field-input" type="email" required autocomplete="email" placeholder="name@example.com">
      <label class="field-label" for="signup-password">كلمة المرور</label>
      <input id="signup-password" class="field-input" type="password" required autocomplete="new-password" minlength="6" placeholder="٦ حروف على الأقل">
      <div id="signup-error" class="field-error"></div>
      <button type="submit" class="primary-btn">إنشاء الحساب</button>
    </form>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app-shell" class="screen" style="display:none;">
  <aside id="sidebar">
    <div class="sidebar-top">
      <span class="brand-mini">Digital Mind</span>
      <button id="new-chat-btn" class="ghost-btn" type="button"><i class="fas fa-plus"></i><span>محادثة جديدة</span></button>
    </div>
    <nav id="conversation-list" class="conversation-list"></nav>
    <div class="sidebar-bottom">
      <div class="user-chip">
        <span id="user-name-label">—</span>
      </div>
      <button id="logout-btn" class="ghost-btn subtle" type="button"><i class="fas fa-arrow-right-from-bracket"></i><span>تسجيل الخروج</span></button>
    </div>
  </aside>

  <main id="chat-main">
    <header id="chat-header">
      <button id="sidebar-toggle" class="icon-btn" type="button" aria-label="القائمة"><i class="fas fa-bars"></i></button>
      <span id="conversation-title">محادثة جديدة</span>
      <div id="usage-window-bar" class="usage-window-bar" title="">
        <span id="usage-window-icon" class="usage-window-icon"><i class="fas fa-clock"></i></span>
        <span class="usage-window-track"><span id="usage-window-fill" class="usage-window-fill"></span></span>
        <span id="usage-window-label" class="usage-window-label">--:--</span>
      </div>
    </header>

    <div id="usage-lock-banner" class="usage-lock-banner" style="display:none;">
      <i class="fas fa-lock"></i>
      <span id="usage-lock-text">الجلسة النهارده خلصت.</span>
    </div>

    <div id="messages" class="messages"></div>

    <div id="attach-preview" class="attach-preview"></div>
    <div id="composer-area" class="composer-area">
      <form id="composer" class="composer">
        <input type="file" id="attach-input" hidden multiple>
        <div class="composer-inner">
          <button type="button" id="attach-btn" class="composer-icon-btn attach-btn" aria-label="إرفاق ملف"><i class="fas fa-paperclip"></i></button>
          <textarea id="composer-input" rows="1" placeholder="اكتب رسالتك..."></textarea>
          <button type="submit" class="send-btn" aria-label="إرسال"><i id="send-btn-icon" class="fas fa-arrow-up"></i></button>
        </div>
      </form>
    </div>
  </main>
</div>

<!-- ============ CONVERSATION CONTEXT MENU (long-press / right-click / kebab) ============ -->
<div id="context-menu-backdrop" class="context-menu-backdrop"></div>
<div id="conv-context-menu" class="context-menu" role="menu"></div>

<!-- ============ RENAME CONVERSATION MODAL ============ -->
<div id="rename-modal" class="app-modal-overlay">
  <div class="app-modal">
    <div class="app-modal-icon accent"><i class="fas fa-pen"></i></div>
    <h3 class="app-modal-title">تعديل اسم المحادثة</h3>
    <form id="rename-form">
      <input id="rename-input" class="field-input" type="text" maxlength="60" autocomplete="off" placeholder="اسم المحادثة">
      <div class="app-modal-actions">
        <button type="button" id="rename-cancel-btn" class="app-modal-btn ghost">إلغاء</button>
        <button type="submit" class="app-modal-btn primary">حفظ</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ DELETE CONVERSATION MODAL ============ -->
<div id="delete-modal" class="app-modal-overlay">
  <div class="app-modal">
    <div class="app-modal-icon danger"><i class="fas fa-trash-can"></i></div>
    <h3 class="app-modal-title">حذف المحادثة؟</h3>
    <p class="app-modal-text" id="delete-modal-text">هتتحذف المحادثة والرسائل اللي فيها نهائيًا، ومش هينفع ترجّعها تاني.</p>
    <div class="app-modal-actions">
      <button type="button" id="delete-cancel-btn" class="app-modal-btn ghost">إلغاء</button>
      <button type="button" id="delete-confirm-btn" class="app-modal-btn danger"><i class="fas fa-trash-can"></i><span>حذف</span></button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
