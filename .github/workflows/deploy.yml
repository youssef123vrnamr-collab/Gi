name: نشر تلقائي على Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود من المستودع
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت مكتبات السيرفر (functions)
        run: npm install
        working-directory: functions

      - name: تثبيت أداة Firebase CLI
        run: npm install -g firebase-tools

      - name: مسح الفانكشن القديمة اللي مبقتش موجودة في الكود (لو موجودة)
        run: firebase functions:delete onBrainStateChange --region asia-northeast1 --project ai-prime-f9017 --force --token "$FIREBASE_TOKEN" || true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # ============================================================
      # النشر بقى على دفعات صغيرة بدل مرة واحدة، عشان نتفادى
      # "Quota exceeded for total allowable CPU per project per region"
      # اللي بتحصل لو حاولنا ننشر كل الـ Cloud Functions مع بعض على
      # حساب Free Trial. كل دفعة بتاخد استراحة (sleep) قبل اللي بعدها
      # عشان نديله وقت يفضّي شوية من الـ CPU المستخدم.
      # ============================================================

      - name: النشر - الدفعة 1 (التصنيف + الأمثلة + التدريب)
        run: firebase deploy --project ai-prime-f9017 --only functions:classify,functions:addExample,functions:bulkImport,functions:onBrainStateChange --force --non-interactive --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: استراحة قبل الدفعة الجاية (تفريغ حصة CPU)
        run: sleep 60

      - name: النشر - الدفعة 2 (الفيدباك + الأدوات الديناميكية)
        run: firebase deploy --project ai-prime-f9017 --only functions:submitFeedback,functions:learnEmoji,functions:resetBrain,functions:saveDynamicTool,functions:runDynamicTool --force --non-interactive --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: استراحة قبل الدفعة الجاية (تفريغ حصة CPU)
        run: sleep 60

      - name: النشر - الدفعة 3 (إدارة الأدوات + التعلم من الويب)
        run: firebase deploy --project ai-prime-f9017 --only functions:listDynamicTools,functions:toggleDynamicTool,functions:confirmPendingKnowledge,functions:rejectPendingKnowledge --force --non-interactive --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: استراحة قبل نشر الاستضافة وقواعد Firestore
        run: sleep 30

      - name: النشر - الاستضافة وقواعد Firestore
        run: firebase deploy --project ai-prime-f9017 --only hosting,firestore --force --non-interactive --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
